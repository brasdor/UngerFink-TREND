services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ungerfink
      POSTGRES_PASSWORD: ungerfink
      POSTGRES_DB: ungerfink_trend
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ungerfink"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ungerfink:ungerfink@db:5432/ungerfink_trend
      REDIS_URL: redis://redis:6379/0
      PROJECT_ROOT: /app/project
      DATA_DIR: /app/project/data
      DEBUG: "true"
    volumes:
      - ./backend:/app
      - .:/app/project:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - api
    command: npm run dev

  scheduler:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://ungerfink:ungerfink@db:5432/ungerfink_trend
      REDIS_URL: redis://redis:6379/0
      PROJECT_ROOT: /app/project
      DATA_DIR: /app/project/data
    volumes:
      - ./backend:/app
      - .:/app/project
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.scheduler
    profiles:
      - full

volumes:
  pgdata:
