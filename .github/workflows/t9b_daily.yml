name: T9B Daily Paper Trading

# Runs daily at 08:00 UTC -- 8 hours after the 1D candle closed at midnight UTC.
# Also triggerable manually from the GitHub Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      run_date:
        description: 'Date to run (YYYY-MM-DD). Leave blank to use yesterday.'
        required: false
        default: ''

jobs:
  t9b-daily:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push committed output files back
      issues: write     # needed to create signal issues

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout the full repo (depth 0 required for clean push)
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # 2. Python setup with pip cache
      # ------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ------------------------------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ------------------------------------------------------------------
      # 3a. Refresh futures data caches (funding + 1D + 4H klines).
      #     Must run before regime_daily.py and all Futures engines.
      #     Probes fapi.binance.com (geo-blocked from US runners as of
      #     2026-07-11) and falls back to data.binance.vision daily dumps
      #     for klines. Funding cannot be refreshed from CI when blocked —
      #     the step prints a staleness warning instead.
      # ------------------------------------------------------------------
      - name: Refresh futures data caches
        id: refresh_data
        continue-on-error: true
        run: python .github/scripts/refresh_futures_data.py

      # ------------------------------------------------------------------
      # 3b. Compute daily regime state (must run before all engines)
      #     Writes data/regime_state.json read by all T9B engines.
      # ------------------------------------------------------------------
      - name: Compute regime state
        id: regime
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            python engines/regime_daily.py --date "${{ github.event.inputs.run_date }}"
          else
            python engines/regime_daily.py
          fi

      # ------------------------------------------------------------------
      # 4a. Run Donchian T9B paper engine
      #     continue-on-error: other engines must still run if this fails
      # ------------------------------------------------------------------
      - name: Run T9B Donchian paper engine
        id: engine_donchian
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            echo "Donchian: running for ${{ github.event.inputs.run_date }}"
            python engines/phase_t9b_donchian_universev2_paper_engine.py \
              --date "${{ github.event.inputs.run_date }}" \
              --notify
          else
            echo "Donchian: running for yesterday"
            python engines/phase_t9b_donchian_universev2_paper_engine.py --notify
          fi

      # ------------------------------------------------------------------
      # 4b. Run MeanReversionRSI T9B paper engine
      #     OHLCV cache is warm for shared symbols from step 4a.
      #     continue-on-error: other engines must still run if this fails
      # ------------------------------------------------------------------
      - name: Run T9B MeanReversionRSI paper engine
        id: engine_mr
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            echo "MR: running for ${{ github.event.inputs.run_date }}"
            python engines/phase_t9b_meanreversion_paper_engine.py \
              --date "${{ github.event.inputs.run_date }}" \
              --notify
          else
            echo "MR: running for yesterday"
            python engines/phase_t9b_meanreversion_paper_engine.py --notify
          fi

      # ------------------------------------------------------------------
      # 4c. Run ConsecDownDaysMR T9B paper engine
      #     OHLCV cache warm from steps 4a/4b.
      #     continue-on-error: workflow must still commit + summarize
      # ------------------------------------------------------------------
      - name: Run T9B ConsecDownDaysMR paper engine
        id: engine_cd
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            echo "ConsecDown: running for ${{ github.event.inputs.run_date }}"
            python engines/phase_t9b_consecdowndays_paper_engine.py \
              --date "${{ github.event.inputs.run_date }}" \
              --notify
          else
            echo "ConsecDown: running for yesterday"
            python engines/phase_t9b_consecdowndays_paper_engine.py --notify
          fi

      # ------------------------------------------------------------------
      # 4d. Run VolContractionShort T9B paper engine (S6, 4H Futures)
      # ------------------------------------------------------------------
      - name: Run T9B VolContraction short engine
        id: engine_vc
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            echo "VolContraction: running for ${{ github.event.inputs.run_date }}"
            python phase_t9b_volcontraction_short_paper_engine.py \
              --date "${{ github.event.inputs.run_date }}" \
              --notify
          else
            echo "VolContraction: running for yesterday"
            python phase_t9b_volcontraction_short_paper_engine.py --notify
          fi

      # ------------------------------------------------------------------
      # 4e. Run MACrossShort T9B paper engine (S7, 4H Futures)
      # ------------------------------------------------------------------
      - name: Run T9B MACross short engine
        id: engine_mac
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            echo "MACross: running for ${{ github.event.inputs.run_date }}"
            python phase_t9b_macross_short_paper_engine.py \
              --date "${{ github.event.inputs.run_date }}" \
              --notify
          else
            echo "MACross: running for yesterday"
            python phase_t9b_macross_short_paper_engine.py --notify
          fi

      # ------------------------------------------------------------------
      # 4f. Run MomentumFactor T9B paper engine (S5, 1D Futures, biweekly)
      # ------------------------------------------------------------------
      - name: Run T9B Momentum Factor engine
        id: engine_mom
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            echo "Momentum: running for ${{ github.event.inputs.run_date }}"
            python engines/phase_t9b_momentum_factor_paper_engine.py \
              --date "${{ github.event.inputs.run_date }}" \
              --no-download --notify
          else
            echo "Momentum: running for yesterday"
            python engines/phase_t9b_momentum_factor_paper_engine.py --no-download --notify
          fi

      # ------------------------------------------------------------------
      # 4g. Run RSI MR Funding Gate T9B paper engine (System 8, 1D Futures)
      #     Signal logic verified 257/257 vs frozen research trades.
      # ------------------------------------------------------------------
      - name: Run T9B RSI MR Funding engine
        id: engine_s8
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            echo "RSI MR Funding: running for ${{ github.event.inputs.run_date }}"
            python engines/phase_t9b_rsi_mr_funding_paper_engine.py \
              --date "${{ github.event.inputs.run_date }}" \
              --notify
          else
            echo "RSI MR Funding: running for yesterday"
            python engines/phase_t9b_rsi_mr_funding_paper_engine.py --notify
          fi

      # ------------------------------------------------------------------
      # 5. Print combined summary (all six systems side-by-side)
      #    continue-on-error: this step is a REPORT, not a producer of
      #    state. On 2026-08-28 it raised on an unformattable cell and
      #    took Mark-to-market, Commit and the Telegram summary down with
      #    it -- a display bug silently cost a day of committed state.
      #    A broken report must never block persistence again; the failure
      #    is surfaced by the alert step below instead.
      # ------------------------------------------------------------------
      - name: Print combined T9B summary
        id: summary
        continue-on-error: true
        run: python engines/t9b_combined_summary.py

      # ------------------------------------------------------------------
      # 5a. Mark-to-market: compute unrealized P&L for all open positions.
      #     Writes equity_curve.csv + mtm_positions.csv per strategy.
      # ------------------------------------------------------------------
      - name: Mark-to-market
        id: mtm
        continue-on-error: true
        run: python .github/scripts/mark_to_market.py

      # ------------------------------------------------------------------
      # 5b. Auto-execute accepted signals (OFF unless AUTO_EXECUTE_ENABLED).
      #     Defaults to TESTNET (fake money). continue-on-error so a placement
      #     problem never fails the run. Idempotent via data/auto_orders ledger.
      # ------------------------------------------------------------------
      - name: Auto-execute accepted signals
        id: autoexec
        continue-on-error: true
        env:
          AUTO_EXECUTE_ENABLED: ${{ vars.AUTO_EXECUTE_ENABLED }}
          EXCHANGE_TESTNET: ${{ vars.EXCHANGE_TESTNET }}
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_SECRET: ${{ secrets.EXCHANGE_SECRET }}
          EQUITY_USDT: ${{ vars.EQUITY_USDT }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          MAX_ORDER_USDT: ${{ vars.MAX_ORDER_USDT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python .github/scripts/auto_execute.py

      # ------------------------------------------------------------------
      # 6. Commit all output files back to the repository.
      #    Uses --force to commit files in .gitignore-adjacent directories.
      # ------------------------------------------------------------------
      - name: Commit output files
        id: commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Engine outputs — one directory add per engine.
          # IMPORTANT: never list individual files in a single git add:
          # one missing pathspec (e.g. daily_log.csv before first signal)
          # makes git add fail atomically and stage NOTHING, and || true
          # hides it. This silently discarded S7 state daily since June 13.
          git add --force data/t9b_paper/ || true
          git add --force data/t9b_mr_paper/ || true
          git add --force data/t9b_consecdowndays_paper/ || true
          git add --force data/t9b_volcontraction_paper/ || true
          git add --force data/t9b_macross_paper/ || true
          git add --force data/t9b_momentum_paper/ || true
          git add --force data/t9b_rsi_mr_funding_paper/ || true

          # Shared OHLCV caches (all engines read/write here)
          git add --force data/universe/ohlcv_1d/ || true
          git add --force data/futures_universe/ohlcv_4h/ || true
          git add --force data/futures_universe/ohlcv_1d/ || true
          git add --force data/futures_universe/funding_rates/ || true

          # Regime state (daily allocator output)
          git add --force \
            data/regime_state.json \
            data/regime_history.csv \
            || true

          # Auto-execution ledger (idempotency record)
          git add --force data/auto_orders/placed.csv || true

          if git diff --cached --quiet; then
            echo "No output file changes to commit."
          else
            TODAY=$(date -u +%Y-%m-%d)
            git commit -m "T9B: daily update ${TODAY} [skip ci]"

            # T9B and T9-candidates run minutes apart and both push to the
            # same branch, so a non-fast-forward here is routine, not an
            # error. The old "pull --rebase || true; push" aborted with
            # "cannot pull with rebase: You have unstaged changes" (the
            # engines leave unstaged files this step never adds), the
            # || true swallowed it, and the push then failed -- which is
            # why exactly one of the two workflows went red most days.
            # autostash handles the unstaged files; retry handles the race.
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git push origin ${{ github.ref_name }}; then
                pushed=1
                break
              fi
              echo "push attempt ${attempt} failed (likely concurrent push) -- rebasing and retrying"
              git -c rebase.autoStash=true pull --rebase origin ${{ github.ref_name }} || {
                echo "rebase failed on attempt ${attempt}"
                sleep $((attempt * 5))
                continue
              }
              sleep $((attempt * 5))
            done
            if [ "${pushed}" != "1" ]; then
              echo "ERROR: could not push output files after 5 attempts"
              exit 1
            fi
          fi

      # ------------------------------------------------------------------
      # 7. Create GitHub issues for new signals (all three systems)
      # ------------------------------------------------------------------
      - name: Create issues for new signals
        id: issues
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/create_signal_issues.py

      # ------------------------------------------------------------------
      # 7b. Push a Telegram summary of today's signals.
      #     continue-on-error: a Telegram outage must never fail the run.
      #     No-ops if the TELEGRAM_* secrets are not configured.
      # ------------------------------------------------------------------
      - name: Send Telegram summary
        id: telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python .github/scripts/send_telegram.py

      # ------------------------------------------------------------------
      # 8. Report engine exit statuses for visibility
      # ------------------------------------------------------------------
      - name: Report step statuses
        if: always()
        run: |
          echo "Engine exit statuses:"
          echo "  Donchian    : ${{ steps.engine_donchian.outcome }}"
          echo "  RSI MR      : ${{ steps.engine_mr.outcome }}"
          echo "  ConsecDown  : ${{ steps.engine_cd.outcome }}"
          echo "  VolContr    : ${{ steps.engine_vc.outcome }}"
          echo "  MACross     : ${{ steps.engine_mac.outcome }}"
          echo "  Momentum    : ${{ steps.engine_mom.outcome }}"
          echo "  RSI MR Fund : ${{ steps.engine_s8.outcome }}"
          echo "Pipeline step statuses:"
          echo "  RefreshData : ${{ steps.refresh_data.outcome }}"
          echo "  Regime      : ${{ steps.regime.outcome }}"
          echo "  Summary     : ${{ steps.summary.outcome }}"
          echo "  MarkToMarket: ${{ steps.mtm.outcome }}"
          echo "  AutoExecute : ${{ steps.autoexec.outcome }}"
          echo "  Commit      : ${{ steps.commit.outcome }}"
          echo "  Issues      : ${{ steps.issues.outcome }}"
          echo "  Telegram    : ${{ steps.telegram.outcome }}"

      # ------------------------------------------------------------------
      # 9. Alert on step failures continue-on-error would otherwise hide.
      #    Fires regardless of overall job status -- one consolidated
      #    Telegram message only if something actually failed.
      # ------------------------------------------------------------------
      - name: Alert on step failures
        if: always()
        env:
          WORKFLOW_LABEL: "T9B Daily"
          # Every step with an id belongs here. The engine steps alone were
          # listed until 2026-08-28, when the summary step crashed and took
          # Mark-to-market / Commit / Telegram with it while this alert
          # printed "all steps OK" -- the silent failure the alert exists
          # to catch. Adding a step without adding it here re-opens that hole.
          STEP_OUTCOMES: "Donchian=${{ steps.engine_donchian.outcome }},RSI-MR=${{ steps.engine_mr.outcome }},ConsecDown=${{ steps.engine_cd.outcome }},VolContraction=${{ steps.engine_vc.outcome }},MACross=${{ steps.engine_mac.outcome }},Momentum=${{ steps.engine_mom.outcome }},RSI-MR-Funding=${{ steps.engine_s8.outcome }},RefreshData=${{ steps.refresh_data.outcome }},Regime=${{ steps.regime.outcome }},Summary=${{ steps.summary.outcome }},MarkToMarket=${{ steps.mtm.outcome }},AutoExecute=${{ steps.autoexec.outcome }},Commit=${{ steps.commit.outcome }},Issues=${{ steps.issues.outcome }},Telegram=${{ steps.telegram.outcome }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python .github/scripts/check_workflow_failures.py

      # ------------------------------------------------------------------
      # 10. Fail the job if any step failed.
      #     Everything above is continue-on-error so one broken step can
      #     never again stop the rest of the pipeline -- but that would
      #     leave the job green and the Actions list would stop showing
      #     trouble at a glance. This restores the red X without
      #     restoring the "one failure kills the run" behaviour.
      # ------------------------------------------------------------------
      - name: Fail job if any step failed
        if: always()
        env:
          OUTCOMES: "${{ steps.engine_donchian.outcome }} ${{ steps.engine_mr.outcome }} ${{ steps.engine_cd.outcome }} ${{ steps.engine_vc.outcome }} ${{ steps.engine_mac.outcome }} ${{ steps.engine_mom.outcome }} ${{ steps.engine_s8.outcome }} ${{ steps.refresh_data.outcome }} ${{ steps.regime.outcome }} ${{ steps.summary.outcome }} ${{ steps.mtm.outcome }} ${{ steps.autoexec.outcome }} ${{ steps.commit.outcome }} ${{ steps.issues.outcome }} ${{ steps.telegram.outcome }}"
        run: |
          for outcome in ${OUTCOMES}; do
            if [ "${outcome}" = "failure" ]; then
              echo "At least one step failed -- see 'Report step statuses' above."
              exit 1
            fi
          done
          echo "All steps completed successfully."
