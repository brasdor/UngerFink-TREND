name: T9B Daily Paper Trading

# Runs daily at 08:00 UTC -- 8 hours after the 1D candle closed at midnight UTC.
# Also triggerable manually from the GitHub Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      run_date:
        description: 'Date to run (YYYY-MM-DD). Leave blank to use yesterday.'
        required: false
        default: ''

jobs:
  t9b-daily:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push committed output files back
      issues: write     # needed to create signal issues

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout the full repo (depth 0 required for clean push)
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # 2. Python setup with pip cache
      # ------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ------------------------------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ------------------------------------------------------------------
      # 4a. Run Donchian T9B paper engine
      #     continue-on-error: other engines must still run if this fails
      # ------------------------------------------------------------------
      - name: Run T9B Donchian paper engine
        id: engine_donchian
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            echo "Donchian: running for ${{ github.event.inputs.run_date }}"
            python engines/phase_t9b_donchian_universev2_paper_engine.py \
              --date "${{ github.event.inputs.run_date }}" \
              --notify
          else
            echo "Donchian: running for yesterday"
            python engines/phase_t9b_donchian_universev2_paper_engine.py --notify
          fi

      # ------------------------------------------------------------------
      # 4b. Run MeanReversionRSI T9B paper engine
      #     OHLCV cache is warm for shared symbols from step 4a.
      #     continue-on-error: other engines must still run if this fails
      # ------------------------------------------------------------------
      - name: Run T9B MeanReversionRSI paper engine
        id: engine_mr
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            echo "MR: running for ${{ github.event.inputs.run_date }}"
            python engines/phase_t9b_meanreversion_paper_engine.py \
              --date "${{ github.event.inputs.run_date }}" \
              --notify
          else
            echo "MR: running for yesterday"
            python engines/phase_t9b_meanreversion_paper_engine.py --notify
          fi

      # ------------------------------------------------------------------
      # 4c. Run ConsecDownDaysMR T9B paper engine
      #     OHLCV cache warm from steps 4a/4b.
      #     continue-on-error: workflow must still commit + summarize
      # ------------------------------------------------------------------
      - name: Run T9B ConsecDownDaysMR paper engine
        id: engine_cd
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            echo "ConsecDown: running for ${{ github.event.inputs.run_date }}"
            python engines/phase_t9b_consecdowndays_paper_engine.py \
              --date "${{ github.event.inputs.run_date }}" \
              --notify
          else
            echo "ConsecDown: running for yesterday"
            python engines/phase_t9b_consecdowndays_paper_engine.py --notify
          fi

      # ------------------------------------------------------------------
      # 5. Print combined summary (all three systems side-by-side)
      # ------------------------------------------------------------------
      - name: Print combined T9B summary
        run: python engines/t9b_combined_summary.py

      # ------------------------------------------------------------------
      # 6. Commit all output files back to the repository.
      #    Uses --force to commit files in .gitignore-adjacent directories.
      # ------------------------------------------------------------------
      - name: Commit output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Donchian outputs
          git add --force \
            data/t9b_paper/state.json \
            data/t9b_paper/open_positions.csv \
            data/t9b_paper/signals_today.csv \
            data/t9b_paper/equity_curve.csv \
            data/t9b_paper/daily_log.csv \
            || true

          # MeanReversionRSI outputs
          git add --force \
            data/t9b_mr_paper/state.json \
            data/t9b_mr_paper/open_positions.csv \
            data/t9b_mr_paper/signals_today.csv \
            data/t9b_mr_paper/equity_curve.csv \
            data/t9b_mr_paper/daily_log.csv \
            || true

          # ConsecDownDaysMR outputs
          git add --force \
            data/t9b_consecdowndays_paper/state.json \
            data/t9b_consecdowndays_paper/open_positions.csv \
            data/t9b_consecdowndays_paper/signals_today.csv \
            data/t9b_consecdowndays_paper/equity_curve.csv \
            data/t9b_consecdowndays_paper/daily_log.csv \
            || true

          # Shared OHLCV cache (all three engines read/write here)
          git add --force data/universe/ohlcv_1d/ || true

          if git diff --cached --quiet; then
            echo "No output file changes to commit."
          else
            TODAY=$(date -u +%Y-%m-%d)
            git commit -m "T9B: daily update ${TODAY} [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin ${{ github.ref_name }}
          fi

      # ------------------------------------------------------------------
      # 7. Create GitHub issues for new signals (all three systems)
      # ------------------------------------------------------------------
      - name: Create issues for new signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/create_signal_issues.py

      # ------------------------------------------------------------------
      # 7b. Push a Telegram summary of today's signals.
      #     continue-on-error: a Telegram outage must never fail the run.
      #     No-ops if the TELEGRAM_* secrets are not configured.
      # ------------------------------------------------------------------
      - name: Send Telegram summary
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python .github/scripts/send_telegram.py

      # ------------------------------------------------------------------
      # 8. Report engine exit statuses for visibility
      # ------------------------------------------------------------------
      - name: Report engine statuses
        if: always()
        run: |
          echo "Engine exit statuses:"
          echo "  Donchian    : ${{ steps.engine_donchian.outcome }}"
          echo "  RSI MR      : ${{ steps.engine_mr.outcome }}"
          echo "  ConsecDown  : ${{ steps.engine_cd.outcome }}"
          if [ "${{ steps.engine_donchian.outcome }}" = "failure" ] || \
             [ "${{ steps.engine_mr.outcome }}" = "failure" ] || \
             [ "${{ steps.engine_cd.outcome }}" = "failure" ]; then
            echo "WARNING: one or more engines failed -- check logs above"
          else
            echo "All engines completed successfully"
          fi
