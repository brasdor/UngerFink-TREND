name: Deploy Telegram Worker

# The Worker was created in the Cloudflare dashboard, so shipping a change to
# status_worker.js meant hand-copying the file into the web editor every time.
# This deploys it on push instead.
#
# Requires, one-time:
#   Secret CLOUDFLARE_API_TOKEN -- Cloudflare -> My Profile -> API Tokens,
#                                  "Edit Cloudflare Workers" template.
#
# The Worker name and account id live in cloudflare/wrangler.toml.

on:
  push:
    branches: [master]
    paths:
      - 'cloudflare/status_worker.js'
      - 'cloudflare/wrangler.toml'
      - '.github/workflows/deploy_worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check required configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN is not set (Settings -> Secrets and variables -> Actions -> Secrets)."
            exit 1
          fi
          grep -q '^name = "ungerfink-status"' cloudflare/wrangler.toml || {
            echo "::error::cloudflare/wrangler.toml no longer names the ungerfink-status Worker. A mismatched name deploys a SECOND Worker and still reports success."
            exit 1
          }

      # Catches a syntax error before it reaches production, where the only
      # symptom would be the bot silently not replying.
      - name: Syntax-check the Worker
        run: node --check cloudflare/status_worker.js

      # Hits the real Binance API. The stubbed unit test could not catch the
      # 2026-08-28 URL-encoding bug that made every coin render as "n/a";
      # this would have. The script exits 0 with SKIPPED when Binance blocks
      # the runner's IP (403/451), which is always the case here, so a red
      # step means a genuine defect rather than the environment.
      - name: Live price-path check
        id: price_check
        continue-on-error: true
        run: node tools/test_price_live.mjs

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # --keep-vars is REQUIRED: without it Wrangler deletes every var not
        # declared in wrangler.toml, which would strip the Worker's GH_TOKEN,
        # ALLOWED_CHAT and friends and leave a deployed-but-dead bot.
        run: |
          npx --yes wrangler@4 deploy \
            --config cloudflare/wrangler.toml \
            --keep-vars

      - name: Report
        if: always()
        run: |
          echo "Worker      : ungerfink-status"
          echo "Price check : ${{ steps.price_check.outcome }}"
          echo "Deploy      : ${{ steps.deploy.outcome }}"
          if [ "${{ steps.price_check.outcome }}" = "failure" ]; then
            echo "::warning::The live price check failed. If Binance returned 451 this is just the runner's geo-block; if it returned 400 the symbols URL is malformed and /price will show n/a for every coin."
          fi
